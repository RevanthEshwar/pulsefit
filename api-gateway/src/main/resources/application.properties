# API Gateway
spring.application.name=api-gateway
server.port=8000

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost

# Attendance Service
spring.cloud.gateway.server.webmvc.routes[0].id=attendance-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://attendance-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/attendance-service/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# Member Service
spring.cloud.gateway.server.webmvc.routes[1].id=member-route
